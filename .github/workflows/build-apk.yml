name: Build APK

# Builds an installable APK in the cloud so you can download it straight to your
# phone - no computer, no Android Studio needed.
#
# How to use it from a phone:
#   1. github.com/esknder12/wakeup -> Actions -> "Build APK" -> Run workflow
#   2. wait ~5 minutes, then open the Releases page and tap the .apk file
#   3. allow "Install unknown apps" for your browser when Android asks

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'arena/**'
    paths-ignore:
      - 'preview/**'
      - '**.md'

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v4

      - name: Make sure the SDK packages this app needs are present
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" || true

      # app/build.gradle.kts signs debug builds with a keystore that is (correctly)
      # kept out of git, so create the standard Android debug keystore here.
      - name: Create the debug keystore
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.7.1'

      - name: Build the debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Name the APK something recognisable
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk \
             "dist/niqu-debug-${{ github.run_number }}.apk"
          ls -lh dist

      - name: Upload the APK as a build artifact
        uses: actions/upload-artifact@v5
        with:
          name: niqu-debug-apk
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish a release you can install from your phone
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="apk-v${{ github.run_number }}"
          cat > notes.md <<'EOF'
          **Niqu ንቁ — debug build**

          Tap the `.apk` file below on your phone to install it.
          Android will ask you to allow *Install unknown apps* for your browser the first time.

          This is a debug build signed with the standard Android debug key, so it installs
          alongside nothing else and is not meant for the Play Store.
          EOF
          echo "" >> notes.md
          echo "Branch \`${{ github.ref_name }}\` · commit \`${GITHUB_SHA:0:7}\`" >> notes.md
          gh release create "$TAG" dist/*.apk \
            --title "Niqu ንቁ debug APK #${{ github.run_number }}" \
            --notes-file notes.md \
            --target "$GITHUB_SHA"

      # Runs after the APK is safely uploaded, so a failing test never costs you the build.
      - name: Unit tests (non-blocking)
        continue-on-error: true
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Upload test reports
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v5
        with:
          name: test-reports
          path: app/build/reports/tests/**
          if-no-files-found: ignore
          retention-days: 7
